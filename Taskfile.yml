# https://taskfile.dev
version: '3'

vars:
  BINARY: server
  COMPILER_SRC: '{{.COMPILER_SRC | default "/tmp/omp-compiler"}}'

tasks:
  default:
    desc: Build the server binary
    deps: [build]
    silent: true

  editor:
    desc: Build web editor
    cmds:
      - npm ci
      - npm run build
    sources:
      - package.json
      - package-lock.json
      - web/js/ppg-editor.js
      - web/js/ppg-editor-state.js
      - web/js/ppg-editor-theme.js
      - web/js/ppg-language.js
      - web/js/pawn*-language.js
    generates:
      - node_modules/.package-lock.json
      - web/js/ppg-editor.bundle.js

  build:
    desc: Compile the Go server binary
    deps: [editor]
    cmds:
      - CGO_ENABLED=0 go build -o {{.BINARY}} ./cmd/server/
    sources:
      - '**/*.go'
      - 'web/**/*.html'
      - 'web/**/*.css'
      - 'web/**/*.js'
      - 'web/wasm/*.wasm'
      - 'web/wasm/*.data'
    generates:
      - '{{.BINARY}}'

  run:
    desc: Build the editor and run the server
    deps: [build]
    cmds:
      - ./{{.BINARY}}

  test:
    desc: Run all tests with race detector
    deps: [editor]
    cmds:
      - npm test
      - CGO_ENABLED=1 go test -v -race -timeout 30s ./...

  test:browser:
    desc: Run editor browser tests (requires Playwright Chromium)
    deps: [editor]
    cmds:
      - npm run test:browser

  coverage:
    desc: Run tests and generate HTML coverage report
    deps: [editor]
    cmds:
      - CGO_ENABLED=1 go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  fmt:
    desc: Format Go source files with gofumpt
    cmds:
      - gofumpt -w .

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  tidy:
    desc: Tidy and verify Go module dependencies
    cmds:
      - go mod tidy
      - go mod verify